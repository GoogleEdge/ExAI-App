version: '3.8'

services:
  exai-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exai-app
    ports:
      - "8100:8100"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/app/data
      - ./uploaded_files:/app/uploaded_files
      - ./users.db:/app/users.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
